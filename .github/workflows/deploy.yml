# Автоматическая публикация сайта на GitHub Pages.
# При каждой загрузке файлов в ветку main GitHub сам собирает сайт и выкладывает его.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: |
          REPO="${{ github.event.repository.name }}"
          # репозиторий вида ник.github.io или свой домен (файл public/CNAME) — сайт в корне
          if [[ "$REPO" == *.github.io ]] || [ -f public/CNAME ]; then
            export BASE_PATH="/"
          else
            export BASE_PATH="/$REPO/"
          fi
          echo "BASE_PATH=$BASE_PATH"
          npm run build
          # чтобы прямые ссылки вида /predmety/fizyka открывались, а не давали 404
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
